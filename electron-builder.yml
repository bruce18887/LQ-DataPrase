# electron-builder configuration for LQ-DataPrase
#
# The build sequence is:
#   1. npm run build          – compile the Vue SPA to frontend/dist/
#   2. npm run electron:build:ts – compile electron TS to frontend/electron-dist/
#   3. npm run pyinstaller    – PyInstaller packaging → dist/LQ-DataPrase/
#   4. electron-builder       – package everything into installer + portable zip
#
# After installation the layout is:
#   <install-dir>/
#     app.asar                  ← frontend/dist/ + frontend/electron-dist/
#     resources/
#       LQ-DataPrase.exe        ← extraResources from dist/LQ-DataPrase/
#       _internal/              ← PyInstaller bundle directory
#
# User data (db.sqlite3, media/, secret.key) is written to:
#   %APPDATA%/lq-dataprase/     ← set via LQDP_BASE_DIR env var

appId: com.lq-dataprase.app
productName: LQ-DataPrase
copyright: "Copyright © 2024 LQ-DataPrase"

directories:
  app: frontend
  output: out
  buildResources: build

files:
  - "dist/**/*"
  - "electron-dist/**/*"
  # Vite 已把全部前端依赖打进 dist/ 的 bundle，运行时不再需要 node_modules。
  # electron-builder 的 node_modules matcher 只收集 files 中的 "!" 排除模式，
  # 不加这行会把 9299 个依赖文件（echarts/element-plus 等）整个打进安装包。
  - "!node_modules/**"

extraResources:
  - from: "dist/LQ-DataPrase/"
    to: "."
    filter:
      - "LQ-DataPrase.exe"
      - "_internal/**"

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LQ-DataPrase
  uninstallDisplayName: LQ-DataPrase
  artifactName: "${productName}-${version}-Setup.${ext}"
  # zip payload + nsisunz::Unzip 直接解压到安装目录（单步，无 7z-out 临时解压 +
  # CopyFiles 复制两步 I/O，无 ~500MB 临时磁盘占用，安装快约一倍）。
  useZip: true
  # 本项目无 electron-updater（autoUpdater），blockmap/差分更新是纯摆设，
  # 且差分模式会强制覆盖 compression 为 normal、把 payload 强制为 7z，
  # 使 useZip 失效——必须显式关闭才能让 zip 直解压生效。
  differentialPackage: false
  # Custom hooks: ask during uninstall whether to delete user data
  # (db.sqlite3, uploaded data files, logs) stored in %APPDATA%\LQ-DataPrase.
  include: build/installer.nsh

# ASAR packaging. 安装耗时瓶颈是散文件数量（此前 16,609 个文件逐一解压+复制，
# 且 Nsis7z/CopyFiles 阶段进度条不更新，表现为"安装卡死"）。asar 把 app 部分
# 44 个文件合成 1 个，安装解包量减半。electron 主进程按 asar 路径编写
# （main.ts 用 __dirname 相对路径 + loadFile，Electron 的 asar fs 层透明处理）。
#
# 历史：曾因 IDE/索引器锁定 asar 导致重建失败而关闭——正确解法是把 out/
# 加入 IDE 的搜索/索引排除（.gitignore 已排除 out/），而非关闭 asar。
asar: true

# Compression: 'normal' 时 payload 为 zip（deflate，-mx=7，Setup.exe ~220-250MB），
# 安装时 nsisunz::Unzip 直接解压到安装目录（配合 useZip: true + differentialPackage: false）。
# 'store' 时 zip 内不压缩（Setup.exe ~610MB），安装为纯写盘零 CPU 解压，最快；
# 适合本地/共享盘分发，不适合网络下载。
compression: "normal"

# Skip @electron/rebuild. This project has no native Node.js addons — all C++
# code lives in the PyInstaller-packaged Python backend. Disabling it saves
# ~5s on every build and avoids an unnecessary node-gyp dependency chain.
npmRebuild: false

# Use the npmmirror Electron mirror so that packaging does not need to reach
# GitHub from mainland networks. The mirror must serve the same .zip layout as
# the official Electron release artifacts.
electronDownload:
  mirror: "https://npmmirror.com/mirrors/electron/"

# Do not attempt to publish to GitHub Releases automatically.
publish: null
