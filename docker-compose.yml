version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ate_analysis
      POSTGRES_USER: ate_user
      POSTGRES_PASSWORD: ate_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://ate_user:ate_password@db:5432/ate_analysis
      - REDIS_URL=redis://redis:6379/0
      # In production override these via a .env file or your secret store:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-only}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - SFTP_CONFIG_KEY=${SFTP_CONFIG_KEY:-}

  celery_worker:
    build: .
    command: celery -A config worker -l info -c 4
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development

volumes:
  postgres_data:
